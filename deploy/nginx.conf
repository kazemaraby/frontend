# SSS HR System - nginx site on the server (installed with apt, not in Docker): HTTPS, then each request to its
# container. Copy to /etc/nginx/sites-available/sss-hr and link it into sites-enabled (guide: the backend repository's
# docs/deploy.md). Every client is a subdomain: https://<client>.hr.ssshrco.com; the platform console is
# https://admin.hr.ssshrco.com. Django picks the tenant from the Host header, so it is passed on unchanged.
#   127.0.0.1:8000        the backend container (Django)
#   127.0.0.1:8080        the frontend container (the built React app)
#   /srv/sss-hr/static    Django's static files, /srv/sss-hr/media its public uploads (written by the backend)

server {
    listen 80;
    listen [::]:80;
    server_name hr.ssshrco.com *.hr.ssshrco.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr.ssshrco.com *.hr.ssshrco.com;

    ssl_certificate /etc/letsencrypt/live/hr.ssshrco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.ssshrco.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;  # documents, CVs and Excel imports
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django: the API, both admin sites and the support sign-in link.
    location ~ ^/(api|admin|support)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Django's static files (the admin) and public uploads (company logos). Personal files never use /media:
    # they go through signed /api/v1/files links.
    location /static/ {
        alias /srv/sss-hr/static/;
        expires 30d;
    }
    location /media/ {
        alias /srv/sss-hr/media/;
        expires 1d;
    }

    # Everything else: the React app, from the frontend container (its own cache headers pass through).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}

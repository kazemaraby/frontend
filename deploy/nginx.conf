# SSS HR System - nginx site (installed on the server, not in Docker).
# Copy to /etc/nginx/sites-available/sss-hr and link it into sites-enabled (docs: the backend repository's
# docs/deploy.md). Every client is a subdomain: https://<client>.hr.ssshrco.com; the platform console is
# https://admin.hr.ssshrco.com. Django picks the tenant from the Host header, so it is passed on unchanged.
#   /opt/sss-hr/frontend/dist         the built React app (this repository: npm run build)
#   /opt/sss-hr/backend               Django (gunicorn on 127.0.0.1:8000), its static files and public uploads

server {
    listen 80;
    listen [::]:80;
    server_name hr.ssshrco.com *.hr.ssshrco.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr.ssshrco.com *.hr.ssshrco.com;

    ssl_certificate /etc/letsencrypt/live/hr.ssshrco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.ssshrco.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;  # documents, CVs and Excel imports
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django: the API, both admin sites and the support sign-in link.
    location ~ ^/(api|admin|support)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Django's static files (the admin) and public uploads (company logos). Personal files never use /media:
    # they go through signed /api/v1/files links.
    location /static/ {
        alias /opt/sss-hr/backend/staticfiles/;
        expires 30d;
    }
    location /media/ {
        alias /opt/sss-hr/backend/media/;
        expires 1d;
    }

    # The React app: hashed assets cached for a year, the service worker and the page itself never cached.
    root /opt/sss-hr/frontend/dist;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

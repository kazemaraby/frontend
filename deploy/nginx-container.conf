# Inside the frontend container: serves the built React app. HTTPS and the routes to Django are the server's nginx.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed assets: cached for a year. The service worker and the page itself: never cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
